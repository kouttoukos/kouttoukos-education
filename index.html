<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kouttukos Education</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
      text-align: center;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 35px 20px;
    }

    h1 {
      margin: 0;
      font-size: 36px;
    }

    .subtitle {
      font-size: 18px;
      margin-top: 10px;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 30px;
      margin: 20px 0;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎓 Kouttoukos Education</h1>
    <div class="subtitle">Ο δικός σου χώρος μάθησης</div>
  </header>

  <div class="container">

    <div class="card">
      <h2>Καλώς ήρθες!</h2>
      <p>
        Εδώ θα οργανώσουμε την εκπαιδευτική μας εφαρμογή,
        ώστε να είναι απλή, όμορφη και εύχρηστη.
      </p>
      <button onclick="alert('Καλώς ήρθες στο Kouttoukos Education!')">
        Ξεκίνα
      </button>
    </div>

  </div>

</body>
</html>
